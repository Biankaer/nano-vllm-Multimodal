[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoinfer"
version = "0.1.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM-style LLM/VLM serving engine based on nano-vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.57.6,<5",
    "flash-attn",
    "ninja>=1.11",
    "xxhash",
]

[project.optional-dependencies]
serving = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "prometheus-client>=0.20.0",
]
multimodal = [
    "accelerate>=0.33.0",
    "pillow>=10.0.0",
    "qwen-vl-utils>=0.0.8",
    "torchvision>=0.19.0",
]
all = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pillow>=10.0.0",
    "prometheus-client>=0.20.0",
    "accelerate>=0.33.0",
    "qwen-vl-utils>=0.0.8",
    "torchvision>=0.19.0",
]

[project.urls]
Homepage="https://github.com/Biankaer/nano-vllm-Multimodal"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
